# Orders writer compaction settings.
# Load these on the orders ingestion job only.
# The inventory job is copy on write and never loads this file.
# The reasoning and the schedule live in compaction.md in this folder.

hoodie.compact.inline=true
hoodie.compact.inline.max.delta.commits=5
hoodie.compaction.payload.class=org.apache.hudi.common.model.OverwriteWithLatestAvroPayload
hoodie.compact.max.num.delta.commits=20
